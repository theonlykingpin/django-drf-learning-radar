name: Update Django and DRF learning resources

on:
  schedule:
    - cron: "17 5 * * *" # Daily at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-learning-resources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Discover and update resources
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: go run .

      - name: Commit README and catalog when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md resources.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh Django and DRF learning resources"
            git push
          fi
